name: token diagnostic
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          case "$TOKEN" in github_pat_*) echo "type: fine-grained";; ghp_*) echo "type: classic";; *) echo "type: unknown";; esac
          h() { curl -s -o /tmp/b -D /tmp/h -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/$1"; }
          echo "/user -> $(h user) login=$(python3 -c 'import json;print(json.load(open("/tmp/b")).get("login"))' 2>/dev/null)"
          grep -i "github-authentication-token-expiration" /tmp/h || true
          echo "private repo -> $(h repos/Lewis-Coding/plan-levels)"
          echo "timer repo -> $(h repos/Lewis-Coding/plan-levels-timer)"
          echo "private workflows -> $(h repos/Lewis-Coding/plan-levels/actions/workflows)"
          grep -i "x-accepted-github-permissions" /tmp/h || true
          echo "repos this token can see: $(h 'user/repos?per_page=100' >/dev/null; python3 -c 'import json;print([r["full_name"] for r in json.load(open("/tmp/b"))])' 2>/dev/null)"
